[project]
name = "call-ai-grapher"
version = "0.2.4"
description = "Improve handwriting using GANS"
license = { text = "Proprietary" }
authors = [
    { name = "Your Name", email = "alberto.villa.manrique@gmail.com" }
]
requires-python = ">=3.11,<4.0"
keywords = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent"
]
dependencies = [
    "python-dateutil>=2.8.2,<3",
    "pyspark>=3.4.1,<4",
    "pyyaml>=6.0.1,<7",
    "torch>=2.13,<3",
    "torchvision>=0.28,<0.29",
    "matplotlib>=3.8.1,<4",
    "imageio>=2.32.0,<3",
    "easyocr>=1.7.1,<2",
    "opencv-python>=4.8.1.78,<5",
    "tensorboardx>=2.6.2.2,<3",
    "tensorboard>=2.15.1,<3",
    "selectivesearch>=0.4,<0.5",
    "numpy>=1.26",
    "ultralytics>=8.4.126",
]

[project.scripts]
improve-document = "call_ai_grapher.cli.improve_document:main"
build-alphabet = "call_ai_grapher.cli.build_alphabet:main"
generate-detector-dataset = "call_ai_grapher.cli.generate_detector_dataset:main"
train-detector = "call_ai_grapher.cli.train_detector:main"
train-classifier = "call_ai_grapher.cli.train_classifier:main"
train-stylizer = "call_ai_grapher.cli.train_stylizer:main"
train-autoencoder = "call_ai_grapher.cli.train_autoencoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_ai_grapher"]
