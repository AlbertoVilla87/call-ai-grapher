[project]
name = "call-aigrapher-ui"
version = "0.2.4"
description = "Gradio web UI for the call-ai-grapher handwriting improvement pipeline"
license = { text = "Proprietary" }
authors = [
    { name = "Your Name", email = "alberto.villa.manrique@gmail.com" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "call-ai-grapher",
    "gradio>=6.15.1,<7",
]

[project.scripts]
ui = "call_aigrapher_ui.app:main"

[tool.uv.sources]
call-ai-grapher = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_aigrapher_ui"]
