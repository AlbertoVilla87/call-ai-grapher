[project]
name = "call-ai-grapher-workspace"
version = "0.2.4"
description = "Improve handwriting using GANS"
license = { text = "Proprietary" }
authors = [
    { name = "Your Name", email = "alberto.villa.manrique@gmail.com" }
]
requires-python = ">=3.11,<4.0"

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
call-ai-grapher = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=2.21.0",
    "ipykernel>=6.27.1,<7",
    "jupyter>=1.0.0,<2",
    "ipython>=8.18.1",
    "pyzmq>=25.1.2,<27",
    "traitlets>=5.14.0,<6",
    "black>=26.3.1,<27",
    "mypy>=1.5.1,<2",
    "types-python-dateutil>=2.8.19.14,<3",
    "call-ai-grapher",
]
test = [
    "coverage>=7,<9",
    "pytest>=9,<10",
    "httpx>=0.27,<1",
]
build = [
    "python-semantic-release>=7,<8",
    "twine<4",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 120
extend-ignore = "E203, E211, E999, F401, F821, W503"
exclude = ".git, __pycache__, dist, .venv"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--junitxml=junit/test-results.xml"
]
testpaths = [
    "backend/tests",
]

[tool.coverage.run]
source = ["call_ai_grapher"]
omit = ["*__init__*"]

[tool.semantic_release]
branch = "main"
version_toml = "backend/pyproject.toml:project.version"
version_source = "commit"
tag_commit = true
major_on_zero = false
commit_parser = "semantic_release.history.emoji_parser"
upload_to_repository = false
remove_dist = false
build_command = "uv build --package call-ai-grapher"
tag_format = "{version}"
major_emoji = "\U0001F4A5"
minor_emoji = "\u2728,\U0001F3D7,\u267B\uFE0F,\u26A1,\U0001F47D"
patch_emoji = ""
