[project]
name = "call_ai_grapher"
version = "0.2.4"
description = "Improve handwriting using GANS"
license = { text = "Proprietary" }
authors = [
    { name = "Your Name", email = "alberto.villa.manrique@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent"
]
dependencies = [
    "black>=23.7,<24",
    "python-dateutil>=2.8.2,<3",
    "types-python-dateutil>=2.8.19.14,<3",
    "pyspark>=3.4.1,<4",
    "pyyaml>=6.0.1,<7",
    "mypy>=1.5.1,<2",
    "torch>=2.1.0,<3",
    "torchvision>=0.16.0,<0.17",
    "matplotlib>=3.8.1,<4",
    "imageio>=2.32.0,<3",
    "jupyter>=1.0.0,<2",
    "pyzmq>=25.1.2,<26",
    "traitlets>=5.14.0,<6",
    "ipython>=8.18.1,<9",
    "easyocr>=1.7.1,<2",
    "opencv-python>=4.8.1.78,<5",
    "tensorboardx>=2.6.2.2,<3",
    "tensorboard>=2.15.1,<3",
    "selectivesearch>=0.4,<0.5",
    "torch-snippets>=0.521,<0.522",
    "numpy>=1.26,<2",
    "ultralytics>=8.4.126",
    "gradio>=4.44.1",
    "gradio-client>=1.0,<1.4",
    "huggingface-hub>=0.25,<1",
    # pydantic >= 2.10 emits boolean `additionalProperties` in JSON schemas,
    # which breaks gradio 4.x api_info introspection
    "pydantic>=2,<2.10",
]

[dependency-groups]
dev = [
    "pre-commit>=2.21.0",
    "ipykernel>=6.27.1,<7",
]
test = [
    "coverage>=7,<8",
    "pytest>=7,<8",
]
build = [
    "python-semantic-release>=7,<8",
    "twine<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_ai_grapher"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 120
extend-ignore = "E203, E211, E999, F401, F821, W503"
exclude = ".git, __pycache__, dist"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--junitxml=junit/test-results.xml"
]

[tool.coverage.run]
source = ["call_ai_grapher"]
omit = ["*__init__*"]

[tool.semantic_release]
branch = "main"
version_toml = "pyproject.toml:project.version"
version_source = "commit"
tag_commit = true
major_on_zero = false
commit_parser = "semantic_release.history.emoji_parser"
upload_to_repository = false
remove_dist = false
build_command = "uv build"
tag_format = "{version}"
major_emoji = "\U0001F4A5"
minor_emoji = "\u2728,\U0001F3D7,\u267B\uFE0F,\u26A1,\U0001F47D"
patch_emoji = ""
